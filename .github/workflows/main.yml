name: CI/CD Pipeline

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      entrypoint:
        description: 'Action to perform (deploy, destroy, or revert)'
        required: true
        default: 'deploy'
      deploy:
        description: 'Target environment (sandbox or prod)'
        required: true
        default: 'sandbox'
      github_token:
        description: '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'
        required: true
      jfrog_username:
        description: 'JFrog registry username'
        required: true
        default: 'travis-ci'
      jfrog_password:
        description: '3ZETas83OW1e54m'
        required: true
      aws_sandbox_role_arn:
        description: 'IAM Role ARN for sandbox'
        required: true
        default: 'arn:aws:iam::496161257016:role/Github'
      aws_prod_role_arn:
        description: 'arn:aws:iam::496161257016:role/Github'
        required: true
      spa_name:
        description: 'SPA name'
        required: true
        default: 'orchestration-ui'
      sandbox_control_tag:
        description: 'Docker control tag for sandbox'
        required: true
        default: 'sandbox_deploy'
      prod_control_tag:
        description: 'Docker control tag for prod'
        required: true
        default: 'prod_deploy'

jobs:
  prebuild:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.entrypoint == 'deploy' || inputs.entrypoint == 'revert' }}
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/terraform-builder:0.11.15-lypatch-2
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    env:
      AWS_REGION: us-east-1
      ROLE_ARN: ${{ inputs.deploy == 'prod' && inputs.aws_prod_role_arn || inputs.aws_sandbox_role_arn }}
      TERRAFORM_DIR: ${{ github.workspace }}/app/${{ inputs.spa_name }}/terraform/ecr
    steps:
      - name: Install AWS CLI & Terraform
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          TERRAFORM_VER=1.5.7
          wget "https://releases.hashicorp.com/terraform/${TERRAFORM_VER}/terraform_${TERRAFORM_VER}_linux_amd64.zip" -O /tmp/terraform.zip
          unzip /tmp/terraform.zip -d /usr/local/bin
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.github_token }}
      - name: Assume AWS Role
        run: |
          CREDS=$(aws sts assume-role --role-arn "$ROLE_ARN" --role-session-name github-actions)
          export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')
          export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')
      - name: Terraform import & output
        run: |
          cd $TERRAFORM_DIR
          terraform init
          terraform import aws_ecr_repository.router ${{ inputs.spa_name }}/router
          terraform apply -auto-approve
          terraform output -json > /tmp/output.json
      - name: Upload Terraform output
        uses: actions/upload-artifact@v3
        with:
          name: terraform-output
          path: /tmp/output.json

  router:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/newdeployment') || inputs.entrypoint == 'deploy' }}
    needs: prebuild
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/argo-base:0.0.1
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    services:
      docker:
        image: docker:17.10-dind
        options: --privileged
    env:
      AWS_REGION: us-east-1
      SPA_NAME: ${{ inputs.spa_name }}
      SANDBOX_TAG: 496161257016
      PROD_TAG: 294150496849
    steps:
      - name: Install AWS CLI & jq
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
      - name: Download Terraform output
        uses: actions/download-artifact@v3
        with:
          name: terraform-output
      - name: Extract ECR URI
        id: ecr
        run: echo "URI=$(jq -r .router_repo_url.value < /tmp/output.json)" >> $GITHUB_OUTPUT
      - name: Docker & npm login
        run: |
          until docker ps; do sleep 1; done
          docker login localytics-docker.jfrog.io \
            -u "${{ inputs.jfrog_username }}" \
            -p "${{ inputs.jfrog_password }}"
          curl -u "${{ inputs.jfrog_username }}:${{ inputs.jfrog_password }}" \
            https://localytics.jfrog.io/localytics/api/npm/npm-local/auth/localytics \
            > ~/.npmrc
      - name: Build (sandbox) or Promote (prod)
        run: |
          REPO=${{ steps.ecr.outputs.URI }}
          if [ "${{ inputs.deploy }}" = "sandbox" ]; then
            TAG1=$SANDBOX_TAG
            TAG2=$GITHUB_RUN_ID
            HASH=$(git rev-parse --short HEAD)
            docker build \
              -t $REPO:$TAG1 \
              -t $REPO:$TAG2 \
              -t $REPO:$HASH \
              -f ./app/$SPA_NAME/Dockerfile \
              ./app
            docker push $REPO:$TAG1
            docker push $REPO:$TAG2
            docker push $REPO:$HASH
          else
            SANDBOX_REG=496161257016
            PROD_REG=294150496849
            docker login $SANDBOX_REG.dkr.ecr.$AWS_REGION.amazonaws.com \
              --username AWS \
              --password-stdin <<< "$(aws ecr get-login-password --region $AWS_REGION)"
            docker login $PROD_REG.dkr.ecr.$AWS_REGION.amazonaws.com \
              --username AWS \
              --password-stdin <<< "$(aws ecr get-login-password --region $AWS_REGION)"
            docker pull $REPO:$SANDBOX_TAG
            docker tag $REPO:$SANDBOX_TAG $REPO:$PROD_TAG
            docker push $REPO:$PROD_TAG
          fi

  terraform-deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/newdeployment') || inputs.entrypoint == 'deploy' }}
    needs: router
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/terraform-builder:0.11.15-lypatch-2
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    env:
      AWS_REGION: us-east-1
      DEPLOY: ${{ inputs.deploy }}
      TERRAFORM_DIR: ${{ github.workspace }}/app/${{ inputs.spa_name }}/terraform
    steps:
      - name: Install AWS CLI & Terraform
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          TERRAFORM_VER=1.5.7
          wget "https://releases.hashicorp.com/terraform/${TERRAFORM_VER}/terraform_${TERRAFORM_VER}_linux_amd64.zip" -O /tmp/terraform.zip
          unzip /tmp/terraform.zip -d /usr/local/bin
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.github_token }}
      - name: Run Terraform
        run: |
          cd $TERRAFORM_DIR
          if [ "$DEPLOY" != "sandbox" ]; then
            ./makeTFFile.sh | tee $DEPLOY.tfvars
          fi
          cp main.tf $TERRAFORM_DIR/
          cp shared.tfvars $TERRAFORM_DIR/
          bash /usr/src/deploy.sh

  terraform-destroy:
    if: ${{ inputs.entrypoint == 'destroy' }}
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/terraform-builder:0.11.15-lypatch-2
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    env:
      AWS_REGION: us-east-1
      DEPLOY: ${{ inputs.deploy }}
      TERRAFORM_DIR: ${{ github.workspace }}/app/${{ inputs.spa_name }}/terraform
    steps:
      - name: Install AWS CLI & Terraform
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          TERRAFORM_VER=1.5.7
          wget "https://releases.hashicorp.com/terraform/${TERRAFORM_VER}/terraform_${TERRAFORM_VER}_linux_amd64.zip" -O /tmp/terraform.zip
          unzip /tmp/terraform.zip -d /usr/local/bin
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.github_token }}
      - name: Destroy via Terraform
        run: |
          cd $TERRAFORM_DIR
          if [ "$DEPLOY" != "sandbox" ]; then
            ./makeTFFile.sh | tee $DEPLOY.tfvars
          fi
          cp main.tf $TERRAFORM_DIR/
          cp shared.tfvars $TERRAFORM_DIR/
          bash /usr/src/deploy.sh
          if [ "$DEPLOY" != "sandbox" ]; then
            aws ecr batch-delete-image \
              --repository-name $SPA_NAME/router \
              --image-ids imageDigest=$(
                aws ecr batch-get-image \
                  --repository-name $SPA_NAME/router \
                  --image-ids imageTag=$DEPLOY \
                  --query 'images[0].imageId.imageDigest' \
                  --output text
              )
            aws s3 rm s3://versioned.files.$DEPLOY/terraform/$SPA_NAME/$DEPLOY.tfstate
          fi

  revert-router-tag:
    if: ${{ inputs.entrypoint == 'revert' }}
    needs: prebuild
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/argo-base:0.0.1
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    services:
      docker:
        image: docker:17.10-dind
        options: --privileged
    env:
      SPA_NAME: ${{ inputs.spa_name }}
      SANDBOX_TAG: 496161257016
      PROD_TAG: 294150496849
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.github_token }}
      - name: Install AWS CLI
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
      - name: Download Terraform output
        uses: actions/download-artifact@v3
        with:
          name: terraform-output
      - name: Extract ECR URI
        id: ecr
        run: echo "URI=$(jq -r .router_repo_url.value < /tmp/output.json)" >> $GITHUB_OUTPUT
      - name: Docker login & revert tag
        run: |
          REPO=${{ steps.ecr.outputs.URI }}
          git fetch --unshallow || true
          PREV=$(git rev-parse --short HEAD^)
          if [ "${{ inputs.deploy }}" = "prod" ]; then
            CONTROL=$PROD_TAG
          else
            CONTROL=$SANDBOX_TAG
          fi
          docker login localytics-docker.jfrog.io \
            -u "${{ inputs.jfrog_username }}" \
            -p "${{ inputs.jfrog_password }}"
          docker pull $REPO:$PREV
          docker tag $REPO:$PREV $REPO:$CONTROL
          docker push $REPO:$CONTROL

  terraform-revert:
    if: ${{ inputs.entrypoint == 'revert' }}
    needs:
      - prebuild
      - revert-router-tag
    runs-on: ubuntu-latest
    container:
      image: localytics-docker.jfrog.io/terraform-builder:0.11.15-lypatch-2
      credentials:
        username: ${{ inputs.jfrog_username }}
        password: ${{ inputs.jfrog_password }}
    env:
      AWS_REGION: us-east-1
      DEPLOY: ${{ inputs.deploy }}
      TERRAFORM_DIR: ${{ github.workspace }}/app/${{ inputs.spa_name }}/terraform
    steps:
      - name: Install AWS CLI & Terraform
        run: |
          apt-get update && apt-get install -y unzip curl wget jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          TERRAFORM_VER=1.5.7
          wget "https://releases.hashicorp.com/terraform/${TERRAFORM_VER}/terraform_${TERRAFORM_VER}_linux_amd64.zip" -O /tmp/terraform.zip
          unzip /tmp/terraform.zip -d /usr/local/bin
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.github_token }}
      - name: Revert via Terraform
        run: |
          cd $TERRAFORM_DIR
          if [ "$DEPLOY" != "sandbox" ]; then
            ./makeTFFile.sh | tee $DEPLOY.tfvars
          fi
          cp main.tf $TERRAFORM_DIR/
          cp shared.tfvars $TERRAFORM_DIR/
          bash /usr/src/deploy.sh
